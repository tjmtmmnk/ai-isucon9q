name: isucari
services:
  nginx:
    image: nginx:1.28
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./etc/nginx/conf.d:/etc/nginx/conf.d
      - ./public:/public
    ports:
      - "80:80"
    networks:
      - my_network

  app:
    build:
      context: .
      # Use ruby/Dockerfile for Ruby, php/Dockerfile for PHP, python/Dockerfile for Python implementation
      dockerfile: go/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: root
      MYSQL_NAME: isucari
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    networks:
      - my_network
    volumes:
      - ./public:/home/public
      - ./sql:/home/sql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true

  mysql:
    image: mysql:8.4
    environment:
      #- "TZ=Asia/Tokyo"
      - "MYSQL_ROOT_HOST=%"
      - "MYSQL_ROOT_PASSWORD=root"
    volumes:
      - mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
      - ./etc/conf.d:/etc/mysql/conf.d
    ports:
      - "3306:3306"
    networks:
      - my_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 1s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: [ "--config=/etc/otel-collector/config.yaml" ]
    volumes:
      - ./etc/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "13133:13133" # Health check
    environment:
      MACKEREL_APIKEY: "${MACKEREL_APIKEY}"
    networks:
      - my_network

volumes:
  mysql:

networks:
  my_network:
